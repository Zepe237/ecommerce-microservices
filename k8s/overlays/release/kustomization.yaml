# Release overlay: the same manifests as k8s/base, but with the images published on GitHub Container Registry
# instead of the images built locally. Deploy with ./scripts/k8s-release.ps1 -Tag sha-xxxxxxx
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
images:
  - name: ecommerce/api-gateway
    newName: ghcr.io/zepe237/ecommerce-api-gateway
    newTag: latest
  - name: ecommerce/order-service
    newName: ghcr.io/zepe237/ecommerce-order-service
    newTag: latest
  - name: ecommerce/cart-service
    newName: ghcr.io/zepe237/ecommerce-cart-service
    newTag: latest
  - name: ecommerce/product-service
    newName: ghcr.io/zepe237/ecommerce-product-service
    newTag: latest
  - name: ecommerce/inventory-service
    newName: ghcr.io/zepe237/ecommerce-inventory-service
    newTag: latest
  - name: ecommerce/customer-service
    newName: ghcr.io/zepe237/ecommerce-customer-service
    newTag: latest
  - name: ecommerce/notification-service
    newName: ghcr.io/zepe237/ecommerce-notification-service
    newTag: latest
  - name: ecommerce/payment-service
    newName: ghcr.io/zepe237/ecommerce-payment-service
    newTag: latest
