# DEVELOPMENT VALUES ONLY (the same defaults as in application.yml).
# In a real environment this Secret is never committed: it is created by the platform
# (kubectl create secret, Sealed Secrets, External Secrets with a vault...).
apiVersion: v1
kind: Secret
metadata:
  name: ecommerce-credentials
type: Opaque
stringData:
  DB_USER: root
  DB_PASSWORD: password
  MONGO_USER: root
  MONGO_PASSWORD: password
