name: Release

# Continuous delivery: every merge on main publishes the 8 images to GitHub Container Registry.
# The tests are not run again here: branch protection only lets a pull request reach main once the CI is green.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # needed to push to ghcr.io with the built-in GITHUB_TOKEN

# Never cancel a release half-way: queue the next one instead.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build the jars
        run: ./mvnw -B --no-transfer-progress -DskipTests package

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the images
        env:
          OWNER: ${{ github.repository_owner }}
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')   # image names must be lowercase
          tag="sha-${GITHUB_SHA::7}"                             # immutable tag: the commit that produced it
          for module in api-gateway order-service cart-service product-service \
                        inventory-service customer-service notification-service payment-service; do
            image="ghcr.io/$owner/ecommerce-$module"
            docker build --build-arg MODULE="$module" \
              --label "org.opencontainers.image.source=$SOURCE" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              -t "$image:$tag" -t "$image:latest" .
            docker push --all-tags "$image"
          done
          echo "### Published images with tag \`$tag\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy: \`./scripts/k8s-release.ps1 -Tag $tag\`" >> "$GITHUB_STEP_SUMMARY"
