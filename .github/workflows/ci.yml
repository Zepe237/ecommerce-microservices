name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push on the same branch cancels the run still in progress: only the latest commit matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      # One failing service must not hide the result of the others.
      fail-fast: false
      matrix:
        module:
          - api-gateway
          - product-service
          - inventory-service
          - cart-service
          - order-service
          - customer-service
          - notification-service
          - payment-service

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit tests and the Testcontainers integration tests (Docker is available on GitHub runners).
      - name: Build and test ${{ matrix.module }}
        run: ./mvnw -B --no-transfer-progress -pl ${{ matrix.module }} -am verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.module }}
          path: ${{ matrix.module }}/target/surefire-reports/
          retention-days: 7
