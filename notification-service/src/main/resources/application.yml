server:
  port: ${SERVER_PORT:8086}

spring:
  application:
    name: notification-service
  mongodb:
    uri: mongodb://${MONGO_USER:root}:${MONGO_PASSWORD:password}@${MONGO_HOST:127.0.0.1}:${MONGO_PORT:27018}/notification_db?authSource=admin
  data:
    mongodb:
      auto-index-creation: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.use.type.headers: false
        spring.json.value.default.type: com.feusap.ecommerce.notification.messaging.OrderCreatedEvent
  mail:
    host: ${MAIL_HOST:127.0.0.1}
    port: ${MAIL_PORT:1025}

app:
  mail:
    from: ${MAIL_FROM:no-reply@feusap-ecommerce.local}
  clients:
    customer-service:
      url: ${CUSTOMER_SERVICE_URL:http://127.0.0.1:8085}
  kafka:
    topics:
      order-created: order.created
