server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/ecom_order_db
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:password}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.add.type.headers: false
  mvc:
    problemdetails:
      enabled: true

app:
  clients:
    cart-service:
      url: ${CART_SERVICE_URL:http://127.0.0.1:8082}
    inventory-service:
      url: ${INVENTORY_SERVICE_URL:http://127.0.0.1:8084}
  kafka:
    topics:
      order-created: order.created
