# Local infrastructure for the e-commerce platform.
# The Spring Boot services run on the host (IDE or ./mvnw) and connect to these containers.
# Credentials are development defaults; override them in a .env file (see .env.example).

name: ecommerce

services:
  postgres-order:
    image: postgres:17
    container_name: ecommerce-postgres-order
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ecom_order_db
    volumes:
      - pgdata-order:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d ecom_order_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-inventory:
    image: postgres:17
    container_name: ecommerce-postgres-inventory
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ecom_inventory_db
    volumes:
      - pgdata-inventory:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d ecom_inventory_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-customer:
    image: postgres:17
    container_name: ecommerce-postgres-customer
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ecom_customer_db
    volumes:
      - pgdata-customer:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d ecom_customer_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-product:
    image: mongo:7
    container_name: ecommerce-mongo-product
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
    volumes:
      - mongodata-product:/data/db

  mongo-notification:
    image: mongo:7
    container_name: ecommerce-mongo-notification
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
    volumes:
      - mongodata-notification:/data/db
  postgres-payment:
    image: postgres:17
    container_name: ecommerce-postgres-payment
    restart: unless-stopped
    ports:
      - "5436:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ecom_payment_db
    volumes:
      - pgdata-payment:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d ecom_payment_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
  redis-cart:
    image: redis:7
    container_name: ecommerce-redis-cart
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata-cart:/data

  kafka:
    image: apache/kafka:4.0.0
    container_name: ecommerce-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      # Single node, KRaft mode (no ZooKeeper): this node is both broker and controller.
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # Two client listeners: localhost for the services started from the IDE,
      # host.docker.internal for the pods running in the Kubernetes (kind) cluster.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,CLUSTER://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,CLUSTER://host.docker.internal:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,CLUSTER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  mailpit:
    image: axllent/mailpit:v1.20.0
    container_name: ecommerce-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  postgres-keycloak:
    image: postgres:17
    container_name: ecommerce-postgres-keycloak
    restart: unless-stopped
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      POSTGRES_DB: keycloak
    volumes:
      - pgdata-keycloak:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Identity provider. Admin console: http://localhost:8180 (admin / admin by default).
  # Port 8180 on the host keeps 8080 free for the API gateway.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: ecommerce-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    ports:
      - "8180:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-keycloak:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-keycloak}
      # Fixes the token issuer, whatever address is used to reach Keycloak.
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    depends_on:
      postgres-keycloak:
        condition: service_healthy

volumes:
  pgdata-order:
  pgdata-inventory:
  pgdata-customer:
  mongodata-product:
  mongodata-notification:
  redisdata-cart:
  pgdata-keycloak:
  pgdata-payment:
