server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: product-service
  profiles:
    default: dev
  mongodb:
    uri: mongodb://${MONGO_USER:root}:${MONGO_PASSWORD:password}@${MONGO_HOST:127.0.0.1}:${MONGO_PORT:27017}/product_db?authSource=admin
  data:
    mongodb:
      representation:
        big-decimal: decimal128
  mvc:
    problemdetails:
      enabled: true
  ai:
    mcp:
      server:
        name: product-catalog
        version: 1.0.0
        protocol: STREAMABLE
springdoc:
  swagger-ui:
    path: /swagger-ui.html
